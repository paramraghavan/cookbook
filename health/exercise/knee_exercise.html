<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Knee Program">
  <title>7-Day Knee Pain Program</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8f3;
      color: #18231f;
      -webkit-font-smoothing: antialiased;
      touch-action: pan-y;
    }
    .app {
      width: 100vw;
      height: 100dvh;
      display: flex;
      transition: transform 260ms ease;
      will-change: transform;
    }
    .page {
      width: 100vw;
      height: 100dvh;
      flex: 0 0 100vw;
      overflow-y: auto;
      padding: max(18px, env(safe-area-inset-top)) 16px calc(98px + env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
    }
    .content {
      max-width: 760px;
      margin: 0 auto;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: #65756c;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 8vw, 44px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    h2 {
      margin: 26px 0 10px;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: #58675f;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin: 18px 0 28px;
    }
    .jump, .exercise {
      display: block;
      width: 100%;
      min-height: 48px;
      border: 1px solid #dce4d8;
      border-radius: 8px;
      background: #fff;
      color: #173f31;
      text-align: left;
      text-decoration: none;
      font: inherit;
      font-weight: 750;
      line-height: 1.25;
      cursor: pointer;
    }
    .jump { padding: 14px; }
    .exercise { padding: 15px 44px 15px 15px; position: relative; }
    .exercise::after {
      content: ">";
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #789084;
      font-weight: 900;
    }
    .list {
      display: grid;
      gap: 10px;
      margin: 12px 0 28px;
      padding: 0;
      list-style: none;
    }
    .section {
      margin: 18px 0;
      padding: 16px;
      border: 1px solid #dce4d8;
      border-radius: 8px;
      background: rgba(255, 255, 255, .7);
    }
    .section h2 { margin-top: 0; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .pill {
      flex: 0 0 auto;
      border: 1px solid #dce4d8;
      border-radius: 999px;
      padding: 9px 12px;
      background: #fff;
      color: #173f31;
      font: inherit;
      font-weight: 800;
    }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .94);
      border-top: 1px solid #dce4d8;
      backdrop-filter: blur(12px);
      -webkit-overflow-scrolling: touch;
    }
    .nav-btn {
      flex: 0 0 auto;
      min-width: 62px;
      border: 0;
      border-radius: 8px;
      padding: 12px 13px;
      background: #e8efe6;
      color: #173f31;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #245c45;
      color: #fff;
    }
    @media (min-width: 720px) {
      .page { padding-left: 28px; padding-right: 28px; }
      .list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="app" id="app" aria-live="polite"></main>
  <nav class="bottom-nav" id="nav" aria-label="Program pages"></nav>

  <script>
    const pages = [
      {
        title: "7-Day Knee Pain Program",
        label: "Main",
        subtitle: "All links in one place. Swipe left/right or use the buttons below.",
        sections: [
          {
            heading: "Daily Program",
            links: [
              ["Day 1: Heel Slides", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=95"],
              ["Day 1: Gentle Knee Extension", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=115"],
              ["Day 2: 90/90 Hip Switches & Pigeon Stretch", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=160"],
              ["Day 2: Ankle Toe Alphabet", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=167"],
              ["Day 3: Banded Terminal Knee Extension", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=216"],
              ["Day 4: Short Walking Intervals & Gait Check", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=289"],
              ["Day 4: Review of Heel Slides & Banded TKEs", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=320"],
              ["Day 5: Chair Sit-to-Stand", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=364"],
              ["Day 5: Glute Bridges", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=421"],
              ["Day 6: Deeper Range Heel Slides", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=437"],
              ["Day 6: 3-Second Tempo Sit-to-Stand", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=445"],
              ["Day 7: Warm-Up Heel Slides", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=516"],
              ["Day 7: 90/90 Hip Rotations & Pigeon Hold", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=521"],
              ["Day 7: Calf Raises", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=530"],
              ["Day 7: Tibialis Raises", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=531"],
              ["Day 7: Knee-to-Wall Ankle Rocks", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=533"],
              ["Day 7: Banded Terminal Knee Extensions", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=540"],
              ["Day 7: Glute Bridges", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=545"],
              ["Day 7: Sit-to-Stand", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=552"],
              ["Day 7: Evening Light Walk", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=560"]
            ]
          },
          {
            heading: "Lower Leg & Foot",
            links: [
              ["Tibialis Raises", "https://www.youtube.com/watch?v=W6WJZaW-OsY&t=18"],
              ["Lengthened Calf Raises", "https://www.youtube.com/watch?v=W6WJZaW-OsY&t=35"],
              ["Single-Leg Soleus Raises", "https://www.youtube.com/watch?v=W6WJZaW-OsY&t=48"],
              ["Big Toe Resistance Band Pulls", "https://www.youtube.com/watch?v=W6WJZaW-OsY&t=75"]
            ]
          }
        ]
      },
      {
        title: "Day 1",
        label: "Day 1",
        subtitle: "Movement & Quad Activation",
        links: [
          ["Heel Slides", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=95"],
          ["Gentle Knee Extension (Cushion Press)", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=115"]
        ]
      },
      {
        title: "Day 2",
        label: "Day 2",
        subtitle: "Joint Mobility",
        links: [
          ["90/90 Hip Switches & Pigeon Stretch", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=160"],
          ["Ankle Toe Alphabet (A-Z)", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=167"]
        ]
      },
      {
        title: "Day 3",
        label: "Day 3",
        subtitle: "Targeted Quad Strength",
        links: [
          ["Banded Terminal Knee Extension (TKE)", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=216"]
        ]
      },
      {
        title: "Day 4",
        label: "Day 4",
        subtitle: "Gait Assessment & Review",
        links: [
          ["Short Walking Intervals & Gait Check", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=289"],
          ["Review of Heel Slides & Banded TKEs", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=320"]
        ]
      },
      {
        title: "Day 5",
        label: "Day 5",
        subtitle: "Standing Functional Strength",
        links: [
          ["Chair Sit-to-Stand", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=364"],
          ["Glute Bridges", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=421"]
        ]
      },
      {
        title: "Day 6",
        label: "Day 6",
        subtitle: "Controlled Progression",
        links: [
          ["Deeper Range Heel Slides", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=437"],
          ["3-Second Controlled Tempo Sit-to-Stand", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=445"]
        ]
      },
      {
        title: "Day 7",
        label: "Day 7",
        subtitle: "Full Routine Summary",
        sections: [
          {
            heading: "Warm-Up & Mobility",
            links: [
              ["Warm-Up Heel Slides", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=516"],
              ["90/90 Hip Rotations & Pigeon Hold", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=521"],
              ["Calf Raises", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=530"],
              ["Tibialis Raises", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=531"],
              ["Knee-to-Wall Ankle Rocks", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=533"]
            ]
          },
          {
            heading: "Strength",
            links: [
              ["Banded Terminal Knee Extensions", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=540"],
              ["Glute Bridges", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=545"],
              ["Sit-to-Stand", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=552"]
            ]
          },
          {
            heading: "Activity",
            links: [
              ["Evening Light Walk", "https://www.youtube.com/watch?v=AdVjP0H3iK0&t=560"]
            ]
          }
        ]
      },
      {
        title: "Lower Leg & Foot",
        label: "Foot",
        subtitle: "Strengthening Exercises",
        links: [
          ["Tibialis Raises", "https://www.youtube.com/watch?v=W6WJZaW-OsY&t=18"],
          ["Lengthened Calf Raises", "https://www.youtube.com/watch?v=W6WJZaW-OsY&t=35"],
          ["Single-Leg Soleus Raises", "https://www.youtube.com/watch?v=W6WJZaW-OsY&t=48"],
          ["Big Toe Resistance Band Pulls", "https://www.youtube.com/watch?v=W6WJZaW-OsY&t=75"]
        ]
      }
    ];

    const app = document.getElementById("app");
    const nav = document.getElementById("nav");
    let currentPage = 0;
    let startX = 0;
    let startY = 0;

    function exerciseList(links) {
      return `<ul class="list">${links.map(([text, url]) =>
        `<li><a class="exercise" href="${url}" target="_blank" rel="noopener">${text}</a></li>`
      ).join("")}</ul>`;
    }

    function renderPage(page, index) {
      const body = page.sections
        ? page.sections.map(section =>
            `<section class="section"><h2>${section.heading}</h2>${exerciseList(section.links)}</section>`
          ).join("")
        : exerciseList(page.links);

      const jumpButtons = index === 0
        ? `<div class="grid">${pages.slice(1).map((page, i) =>
            `<button class="jump" type="button" onclick="goToPage(${i + 1})">${page.label}<br><span style="color:#65756c;font-weight:650">${page.subtitle}</span></button>`
          ).join("")}</div>`
        : "";

      return `<section class="page" aria-label="${page.title}">
        <div class="content">
          <div class="topbar">
            <div>
              <p class="eyebrow">${index === 0 ? "Program" : "Exercise Page"}</p>
              <h1>${page.title}</h1>
            </div>
            ${index === 0 ? "" : `<button class="pill" type="button" onclick="goToPage(0)">Main</button>`}
          </div>
          <p>${page.subtitle}</p>
          ${jumpButtons}
          ${body}
        </div>
      </section>`;
    }

    function render() {
      app.innerHTML = pages.map(renderPage).join("");
      nav.innerHTML = pages.map((page, index) =>
        `<button class="nav-btn" type="button" onclick="goToPage(${index})" aria-label="Open ${page.title}">${page.label}</button>`
      ).join("");
      goToPage(0, false);
    }

    function goToPage(index, animate = true) {
      currentPage = Math.max(0, Math.min(index, pages.length - 1));
      if (!animate) app.style.transition = "none";
      app.style.transform = `translateX(-${currentPage * 100}vw)`;
      document.querySelectorAll(".nav-btn").forEach((button, i) => {
        button.classList.toggle("active", i === currentPage);
        button.setAttribute("aria-current", i === currentPage ? "page" : "false");
      });
      const activeButton = document.querySelectorAll(".nav-btn")[currentPage];
      if (activeButton) activeButton.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      setTimeout(() => { app.style.transition = "transform 260ms ease"; }, 0);
    }

    document.addEventListener("touchstart", event => {
      const touch = event.changedTouches[0];
      startX = touch.screenX;
      startY = touch.screenY;
    }, { passive: true });

    document.addEventListener("touchend", event => {
      const touch = event.changedTouches[0];
      const dx = touch.screenX - startX;
      const dy = touch.screenY - startY;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
      if (dx < 0) goToPage(currentPage + 1);
      if (dx > 0) goToPage(currentPage - 1);
    }, { passive: true });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowRight") goToPage(currentPage + 1);
      if (event.key === "ArrowLeft") goToPage(currentPage - 1);
      if (event.key === "Home") goToPage(0);
    });

    render();
  </script>
</body>
</html>
